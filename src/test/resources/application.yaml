# 테스트 전용 설정. 컨텍스트 로드만 확인하므로 접속하지 않는 더미 값을 쓴다.
# 실제 값은 config/application.env 에 두고 run.sh 가 주입한다.
spring:
  application:
    name: discovery-interface
  datasource:
    driver-class-name: com.ibm.db2.jcc.DB2Driver
    url: jdbc:db2://localhost:50000/TESTDB
    username: test
    password: test
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0

device42:
  doql:
    rest:
      base-url: https://localhost
      username: test
      password: test
      truststore: config/d42-truststore.p12
      truststore-password: test
      connect-timeout: 10s
      response-timeout: 120s
    jdbc:
      driver-class-name: com.device42.jdbc.D42Driver
      url: jdbc:d42://localhost/
      username: test
      password: test
